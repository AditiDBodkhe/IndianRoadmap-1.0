spring:
  application:
    name: audio-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/indianroadmap_audio}
      auto-index-creation: true

  threads:
    virtual:
      enabled: true

  jackson:
    deserialization:
      fail-on-null-for-primitives: false

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: audio-service
    description: IndianRoadmap Audio Service

logging:
  level:
    com.indianroadmap: INFO
    org.springframework.data.mongodb: WARN

indianroadmap:
  services:
    story:
      base-url: ${STORY_SERVICE_URL:http://localhost:8083}

audio:
  storage:
    path: ${AUDIO_STORAGE_PATH:./data/audio}
  tts:
    provider: ${TTS_PROVIDER:MOCK}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
