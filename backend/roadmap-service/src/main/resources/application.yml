spring:
  application:
    name: roadmap-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/indianroadmap_roadmaps}
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-null-for-primitives: false

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

indianroadmap:
  services:
    destination:
      base-url: ${DESTINATION_SERVICE_URL:http://localhost:8081}
  roadmap:
    max-nodes-per-roadmap: 50
    max-edges-per-roadmap: 200
