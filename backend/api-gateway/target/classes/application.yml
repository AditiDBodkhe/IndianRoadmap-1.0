spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:10000}ms
    discovery:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    discovery:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

indianroadmap:
  services:
    destination: ${DESTINATION_SERVICE_URL:http://localhost:8081}
    roadmap: ${ROADMAP_SERVICE_URL:http://localhost:8082}
    story: ${STORY_SERVICE_URL:http://localhost:8083}
    audio: ${AUDIO_SERVICE_URL:http://localhost:8084}
    recommendation: ${RECOMMENDATION_SERVICE_URL:http://localhost:8085}
    user: ${USER_SERVICE_URL:http://localhost:8086}
    ai: ${AI_SERVICE_URL:http://localhost:8090}
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-key-at-least-32-chars-long-for-hs256}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  gateway:
    timeout:
      connect-ms: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
      response-ms: ${GATEWAY_RESPONSE_TIMEOUT_MS:10000}
