spring:
  application:
    name: recommendation-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/indianroadmap_recommendations}
      auto-index-creation: true

  threads:
    virtual:
      enabled: true

  jackson:
    deserialization:
      fail-on-null-for-primitives: false

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: recommendation-service
    description: IndianRoadmap Recommendation Service

logging:
  level:
    com.indianroadmap: INFO
    org.springframework.data.mongodb: WARN

indianroadmap:
  services:
    destination:
      base-url: ${DESTINATION_SERVICE_URL:http://localhost:8081}
    story:
      base-url: ${STORY_SERVICE_URL:http://localhost:8083}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
